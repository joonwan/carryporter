# HTTP -> HTTPS 리다이렉트
server {
    listen 80;
    server_name i14e101.p.ssafy.io;
    return 301 https://$host$request_uri;
}

# HTTPS 서버
server{
        listen 443 ssl;
        server_name i14e101.p.ssafy.io;
        client_max_body_size 50m;

        # SSL 인증서 설정
        ssl_certificate /etc/letsencrypt/live/i14e101.p.ssafy.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/i14e101.p.ssafy.io/privkey.pem;

        # SSL 보안 설정
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        # 프론트엔드 정적 파일 직접 서빙 (Blue-Green 배포용)
        location / {
            root __FRONT_ROOT__;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Admin Frontend (Blue-Green 배포용)
        location /admin {
            alias __ADMIN_ROOT__;
            index index.html;
            try_files $uri $uri/ /admin/index.html;
        }

        # 백엔드 API
        location /api {
            proxy_pass http://backend:8080; # /api/ 제거 후 전달

            proxy_set_header Host  $host;  # 원래 도메인 유지 (기본값은 컨테이너 이름으로 덮어씌워짐)
            proxy_set_header X-Forwarded-Proto $scheme;    # https 여부 전달
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # 클라이언트 실제 IP 전달

            # SSE — 응답을 버퍼에 쌓지 않고 즉시 클라이언트로 전달
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';   # keep-alive 연결 유지
            proxy_http_version 1.1;  # HTTP/1.1 필수 (chunked transfer 지원)
            chunked_transfer_encoding off;  # SSE는 chunked 인코딩 불필요
            proxy_read_timeout 86400s; # 연결 끊김 방지 (24시간)
        }

        # Jenkins
        location /jenkins {
            proxy_pass http://jenkins:8080/jenkins;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_request_buffering off;
        }
}